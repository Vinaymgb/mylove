<!DOCTYPE html>
<html>
<head>
  <title>Just For You ❤️</title>
  <style>
    body {
      background: linear-gradient(120deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      color: #fff;
      font-size: 3em;
    }
    p {
      color: #fff;
      font-size: 1.5em;
    }
    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      background: #ff4b5c;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Hey My Love ❤️</h1>
<p>I coded this just to see you smile 😊</p>

<button onclick="showLove()">Click Me 💕</button>

<p id="msg"></p>

<script>
  function showLove() {
    document.getElementById("msg").innerHTML =
      "You are my favorite person in the whole universe 🌍❤️";
  }
</script>
  <audio id="bgm" loop>
  <source src="love.mp3" type="audio/mpeg">
</audio>

</body>
</html>
