<!DOCTYPE html>
<html>
<head>
  <title>Just For You ❤️</title>

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background: linear-gradient(120deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
      overflow: hidden;
    }

    h1 {
      color: #fff;
      font-size: 3em;
      animation: fadeIn 2s ease-in-out;
    }

    p {
      color: #fff;
      font-size: 1.5em;
      animation: fadeIn 3s ease-in-out;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: #ff4b5c;
      color: white;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(255, 75, 92, 0.8);
    }

    #msg {
      margin-top: 20px;
      font-size: 1.8em;
    }

    #loveImg {
      display: none;
      width: 260px;
      margin-top: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .heart {
      position: absolute;
      color: red;
      font-size: 24px;
      animation: floatUp 5s linear infinite;
    }

    @keyframes floatUp {
      from { bottom: -50px; opacity: 1; }
      to { bottom: 100vh; opacity: 0; }
    }
  </style>
</head>

<body>

  <h1>Hey My Love ❤️</h1>
  <p>I coded this just to see you smile 😊</p>

  <button onclick="showLove()">Click Me 💕</button>

  <p id="msg"></p>

  <!-- IMAGE -->
  <img 
    id="loveImg"
    src="images/IMG-20251203-WA0011.jpg"
    alt="My Love ❤️"
  >

  <!-- MUSIC -->
  <audio id="bgm" loop preload="auto">
  <source src="love.mp3" type="audio/mpeg">
  Your browser does not support audio.
</audio>

  <script>
    function showLove() {
      // Message
      document.getElementById("msg").innerHTML =
        "You are my favorite person in the whole universe 🌍❤️ Happy Teddy Day chinni 🧸";

      // Show image
      document.getElementById("loveImg").style.display = "block";

      // Play music
      document.getElementById("bgm").play();

      // Confetti burst 🎉
      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 }
      });

      // Floating hearts ❤️
      for (let i = 0; i < 20; i++) {
        createHeart();
      }
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 5000);
    }
  </script>

</body>
</html>
